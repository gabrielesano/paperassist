[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "paperassist"
dynamic = ["version"]
description = "A local research paper reader and shared library."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pypdf>=6.0,<7",
    # PySide6 6.12.0 drops a reference to None on every void call. Python 3.11,
    # where None is not immortal, crashes after a few thousand calls.
    "PySide6-Essentials>=6.10,<6.12; python_version < '3.12'",
    "PySide6-Essentials>=6.10,<7; python_version >= '3.12'",
    "pypdfium2>=5.14,<6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
paperassist = "paperassist.cli:main"
paperassist-desktop = "paperassist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "paperassist.__version__"}
