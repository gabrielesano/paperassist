[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "paperassist"
dynamic = ["version"]
description = "A local research paper reader and shared library."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["Flask>=3.0,<4", "pypdf>=6.0,<7"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
desktop = [
    "pywebview[qt]>=6.2,<7; sys_platform == 'linux'",
    "pywebview>=6.2,<7; sys_platform != 'linux'",
]

[project.scripts]
paperassist = "paperassist.cli:main"
paperassist-desktop = "paperassist.cli:desktop_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "paperassist.__version__"}

[tool.setuptools.package-data]
paperassist = ["web/*", "web/**/*"]
