name: macOS

# Manual and weekly, because macOS runners are scarce for private repositories.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  python:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e "."
      - run: PYTHONPATH=tests python -m unittest test_native_lifecycle.NativeProcessTests -v
        env:
          QT_QPA_PLATFORM: cocoa  # exercise macOS activation and popup focus on the runner's desktop
