name: macOS

# Manual and weekly, because macOS runners are scarce for private repositories.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  python:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
