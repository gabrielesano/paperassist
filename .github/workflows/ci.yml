name: CI

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs in macos.yml: its runners are often unavailable for this private
        # repository and would leave every push red without running a single test.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Qt's offscreen platform needs a few system libraries that minimal Linux runners lack.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e "."
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen  # the native reader tests open widgets without a display
