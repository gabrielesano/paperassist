name: Build

# Manual only: a full bundle takes minutes and the artifacts are large.
on: workflow_dispatch

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The Qt libraries link GL and a few X libraries even when the offscreen platform is used.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install ".[native]" "pyinstaller>=6.15,<7"
      - run: pyinstaller packaging/paperassist.spec --noconfirm --distpath dist --workpath build
      - name: Make a small PDF
        shell: python
        run: |
          import pymupdf
          doc = pymupdf.open()
          page = doc.new_page()
          page.insert_text((72, 100), "PaperAssist self-test", fontsize=18)
          doc.save("synthetic.pdf")
      - name: Self-test the bundle
        shell: bash
        run: dist/PaperAssist/PaperAssist${{ runner.os == 'Windows' && '.exe' || '' }} --self-test synthetic.pdf
      # upload-artifact drops symlinks and file modes, which the Linux and macOS bundles rely on.
      - if: runner.os != 'Windows'
        run: tar -czf PaperAssist-${{ runner.os }}.tar.gz -C dist PaperAssist
      - uses: actions/upload-artifact@v4
        with:
          name: PaperAssist-${{ runner.os }}
          path: ${{ runner.os == 'Windows' && 'dist/PaperAssist' || format('PaperAssist-{0}.tar.gz', runner.os) }}
