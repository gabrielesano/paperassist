name: Build

# Manual only: a full bundle takes minutes and the artifacts are large.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Package target (choose one when retrying a host)
        type: choice
        default: all
        options:
          - all
          - ubuntu-22.04
          - windows-latest
          - macos-latest

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["ubuntu-22.04","windows-latest","macos-latest"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The Qt libraries link GL and display server libraries even when the offscreen platform is used.
      # Pinning the Linux runner to ubuntu-22.04 establishes a portable glibc 2.35+ baseline.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 desktop-file-utils
      - run: python -m pip install "." "pyinstaller>=6.15,<7"
      - name: Build minimal bundled OCR from pinned sources
        run: python packaging/ocr/build_ocr.py
      - name: Create the macOS application icon
        if: runner.os == 'macOS'
        run: python packaging/desktop/generate_icons.py --output-dir build/icons --icns build/icons/PaperAssist.icns
      - name: Create the Windows application icon
        if: runner.os == 'Windows'
        run: python packaging/desktop/generate_icons.py --output-dir build/icons --ico build/icons/PaperAssist.ico
      - run: pyinstaller packaging/paperassist.spec --noconfirm --distpath dist --workpath build
      - name: Self-test the bundle
        shell: bash
        run: dist/PaperAssist/PaperAssist${{ runner.os == 'Windows' && '.exe' || '' }} --self-test tests/fixtures/pdfjs-annotations.pdf
      - name: Verify bundled OCR with no system engine or model search path
        run: python -m unittest tests.test_frozen_ocr -v

      # Build Linux self-extracting installer and package artifacts
      - name: Build Linux installer and archive
        if: runner.os == 'Linux'
        run: |
          python packaging/installer/build_installer.py --bundle-dir dist/PaperAssist --desktop-dir packaging/desktop --output-dir dist
          tar -czf dist/PaperAssist-Linux.tar.gz -C dist PaperAssist
          (cd dist && sha256sum PaperAssist-*-linux-x86_64.sh PaperAssist-Linux.tar.gz > SHA256SUMS)

      - name: Verify installer checksums and integrity
        if: runner.os == 'Linux'
        run: |
          (cd dist && sha256sum -c PaperAssist-*-linux-x86_64.sh.sha256)
          sh dist/PaperAssist-*-linux-x86_64.sh --verify

      - name: Test Linux packaging safeguards
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tests -p 'test_glibc_audit.py' -v
          python -m unittest discover -s tests -p 'test_linux_installer_concurrency.py' -v

      - name: ELF GLIBC baseline audit
        if: runner.os == 'Linux'
        run: python packaging/audit_glibc.py dist/PaperAssist

      - name: Verify installer execution, self-test, and uninstallation
        if: runner.os == 'Linux'
        run: |
          HOME=/tmp/ci-install-test sh dist/PaperAssist-*-linux-x86_64.sh
          /tmp/ci-install-test/.local/bin/paperassist --version
          /tmp/ci-install-test/.local/bin/paperassist --self-test tests/fixtures/pdfjs-annotations.pdf
          python -c "from pathlib import Path; from tests.test_ocr import scan_pdf; scan_pdf(Path('/tmp/ci-install-test/scan.pdf'))"
          env PATH=/nonexistent TESSDATA_PREFIX=/nonexistent /tmp/ci-install-test/.local/bin/paperassist --self-test-ocr /tmp/ci-install-test/scan.pdf
          /tmp/ci-install-test/.local/share/paperassist-app/uninstall.sh

      - name: Run frozen bundle and installer test suite
        if: runner.os == 'Linux'
        run: |
          python -m unittest tests.test_frozen_bundle tests.test_frozen_file_delivery tests.test_linux_installer tests.test_desktop_entry -v

      - name: Build the Apple Silicon disk image
        if: runner.os == 'macOS'
        run: python packaging/macos/build_dmg.py

      - name: Verify the mounted disk image and installed macOS app
        if: runner.os == 'macOS'
        run: python -m unittest tests.test_macos_bundle -v

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: python packaging/windows/build_installer.py

      - name: Verify Windows installation, upgrade, GUI, and uninstallation
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_windows_installer -v

      # Artifact uploads
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: PaperAssist-Linux
          path: |
            dist/PaperAssist-*-linux-x86_64.sh
            dist/PaperAssist-*-linux-x86_64.sh.sha256
            dist/SHA256SUMS
            dist/PaperAssist/THIRD-PARTY-NOTICES.txt
            dist/PaperAssist/BUILD-PROVENANCE.json
            dist/PaperAssist/_internal/ocr/manifest.json
            dist/PaperAssist-Linux.tar.gz

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PaperAssist-Windows
          path: |
            dist/PaperAssist-*-windows-x86_64-setup.exe
            dist/PaperAssist-*-windows-x86_64-setup.exe.sha256
            dist/PaperAssist/THIRD-PARTY-NOTICES.txt
            dist/PaperAssist/BUILD-PROVENANCE.json
            dist/PaperAssist/_internal/ocr/manifest.json

      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PaperAssist-macOS
          path: |
            dist/PaperAssist-*-macos-arm64.dmg
            dist/PaperAssist-*-macos-arm64.dmg.sha256
            dist/PaperAssist/THIRD-PARTY-NOTICES.txt
            dist/PaperAssist/BUILD-PROVENANCE.json
            dist/PaperAssist/_internal/ocr/manifest.json
